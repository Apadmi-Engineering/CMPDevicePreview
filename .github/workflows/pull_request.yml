name: Pull Request

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # release-please PRs only bump the version and changelog, so there is nothing to lint or build.
  # The same-repo check stops a fork from skipping CI by naming its branch like one.
  lint:
    if: ${{ !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check code style
        run: ./gradlew spotlessCheck

  build:
    if: ${{ !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { target: jvm, os: ubuntu-latest, tasks: ":cmpdevicepreview:jvmTest :sample:composeApp:compileKotlinJvm :sample:desktopApp:compileKotlin" }
          - { target: android, os: ubuntu-latest, tasks: ":cmpdevicepreview:compileAndroidMain :sample:androidApp:assembleDebug" }
          - { target: web, os: ubuntu-latest, tasks: ":cmpdevicepreview:jsBrowserTest :cmpdevicepreview:wasmJsBrowserTest :sample:composeApp:wasmJsBrowserDevelopmentExecutableDistribution" }
          - { target: web-js, os: ubuntu-latest, tasks: ":sample:composeApp:jsBrowserDevelopmentExecutableDistribution" }
          # Kotlin/Native only builds the Apple targets on macOS.
          - { target: ios, os: macos-latest, tasks: ":cmpdevicepreview:compileKotlinIosSimulatorArm64 :sample:composeApp:compileKotlinIosSimulatorArm64" }
          - { target: macos, os: macos-latest, tasks: ":cmpdevicepreview:compileKotlinMacosArm64 :sample:composeApp:compileKotlinMacosArm64" }
    runs-on: ${{ matrix.config.os }}
    name: Build ${{ matrix.config.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and test ${{ matrix.config.target }}
        run: ./gradlew ${{ matrix.config.tasks }}
