name: Pull Request

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { target: jvm, os: ubuntu-latest, tasks: ":cmpdevicepreview:jvmTest" }
          - { target: android, os: ubuntu-latest, tasks: ":cmpdevicepreview:compileAndroidMain :androidApp:assembleDebug" }
          - { target: web, os: ubuntu-latest, tasks: ":cmpdevicepreview:compileKotlinJs :composeApp:wasmJsBrowserDevelopmentExecutableDistribution" }
          # Kotlin/Native only builds the iOS targets on macOS.
          - { target: ios, os: macos-latest, tasks: ":cmpdevicepreview:compileKotlinIosSimulatorArm64 :composeApp:compileKotlinIosSimulatorArm64" }
    runs-on: ${{ matrix.config.os }}
    name: Build ${{ matrix.config.target }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test ${{ matrix.config.target }}
        run: ./gradlew ${{ matrix.config.tasks }}
