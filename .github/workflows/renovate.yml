name: Renovate

# Self-hosted Renovate; the rules are in renovate.json. It runs on the first of each month, and
# that cron is the only schedule: renovate.json has none, so a run opens every pending pull
# request. Run it by hand from the Actions tab to get updates sooner, or to process a rebase or
# Dependency Dashboard request, which otherwise waits for the next monthly run.
#
# Repository secret used:
#   RENOVATE_TOKEN  a fine-grained personal access token or GitHub App token for this repository
#                   with Contents, Pull requests, Issues and Workflows read and write access.
#                   It must not be the default GITHUB_TOKEN, which can't edit workflow files and
#                   doesn't start build.yml on the pull requests it opens.
on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

# Renovate works through RENOVATE_TOKEN, so the job's own token needs no access.
permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # renovate.json is already in the repository, so there is nothing to onboard.
          RENOVATE_ONBOARDING: 'false'
